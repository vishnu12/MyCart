services:

  server:
    build:
      context: ./server
      dockerfile: Dockerfile

    container_name: socialmedia-server

    ports:
      - "5000:5000"

    volumes:
      - ./uploads:/app/uploads

    environment:
      NODE_ENV: production

    restart: unless-stopped


  client:
    build:
      context: ./client
      dockerfile: Dockerfile

    container_name: socialmedia-client

    ports:
      - "3000:80"

    depends_on:
      - server

    restart: unless-stopped
